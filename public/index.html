<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maestro</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brandmark">Maestro</div>
      <span class="tag">Prototype · synthetic data</span>
      <nav id="nav" aria-label="Maestro sections">
        <a href="#insights">Insights</a>
        <a href="#projections">Projections</a>
        <a href="#campaigns">Campaigns</a>
        <a href="#mappings">Mappings</a>
        <a href="#import">Import</a>
      </nav>
      <div class="side-foot">
        <label>Currency
          <div class="seg" id="cur" title="Display currency"><button data-cur="USD">USD</button><button data-cur="CAD">CAD</button></div>
        </label>
        <label>Viewing as
          <select id="role">
            <option value="marketer">Marketing manager</option>
            <option value="approver">Approver</option>
            <option value="finance">Finance</option>
          </select>
        </label>
      </div>
    </aside>
    <div class="page">
      <div class="filters" id="filters">
        <label>Division <select id="f-division"></select></label>
        <label>Region <select id="f-region"></select></label>
        <label>Brand <select id="f-brand"></select></label>
        <label>Market location <select id="f-location"></select></label>
        <label>Year <select id="f-year"></select></label>
        <span class="muted" id="fxnote"></span>
      </div>
      <main id="view"></main>
    </div>
  </div>
  <div id="toast" role="status"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
