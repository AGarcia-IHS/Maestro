<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maestro</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <div class="brandmark">Maestro <span class="tag">Prototype · synthetic data</span></div>
    <nav id="nav">
      <a href="#insights">Insights</a>
      <a href="#projections">Projections</a>
      <a href="#campaigns">Campaigns</a>
      <a href="#mappings">Mappings</a>
      <a href="#import">Import</a>
    </nav>
    <label class="role">Viewing as
      <select id="role">
        <option value="marketer">Marketing manager</option>
        <option value="approver">Approver</option>
        <option value="finance">Finance</option>
      </select>
    </label>
  </header>
  <div class="filters" id="filters">
    <label>Brand <select id="f-brand"></select></label>
    <label>Market location <select id="f-location"></select></label>
  </div>
  <main id="view"></main>
  <div id="toast" role="status"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
