<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maestro</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brandmark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg>Maestro</div>
      <span class="tag">Prototype · synthetic data</span>
      <div class="side-head">Marketing</div>
      <nav id="nav" aria-label="Maestro sections">
        <a href="#dashboard"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 15l3-4 3 2 4-6"/></svg>Marketing Dashboard</a>
        <a href="#insights"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0012 3z"/></svg>Insights</a>
        <a href="#projections"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4M16 3v4"/></svg>Budget Manager</a>
        <a href="#campaigns"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11v2a1 1 0 001 1h2l5 4V6L6 10H4a1 1 0 00-1 1z"/><path d="M15 9a4 4 0 010 6"/><path d="M18 6a8 8 0 010 12"/></svg>Campaign Management</a>
        <a href="#mappings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M6 8.5v2a3 3 0 003 3h6a3 3 0 003-3v-2"/><path d="M12 13.5v2"/></svg>Mappings</a>
        <a href="#import"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/></svg>Import</a>
      </nav>
      <div class="side-foot">
        <label>Currency
          <div class="seg" id="cur" title="Display currency"><button data-cur="USD">USD</button><button data-cur="CAD">CAD</button></div>
        </label>
        <label>Viewing as
          <select id="role">
            <option value="marketer">Marketing manager</option>
            <option value="approver">Approver</option>
            <option value="finance">Finance</option>
          </select>
        </label>
      </div>
    </aside>
    <div class="page">
      <div class="filters" id="filters">
        <label>Division <select id="f-division"></select></label>
        <label>Region <select id="f-region"></select></label>
        <label>Brand <select id="f-brand"></select></label>
        <label>Market location <select id="f-location"></select></label>
        <label>Year <select id="f-year"></select></label>
        <span class="muted" id="fxnote"></span>
      </div>
      <main id="view"></main>
    </div>
  </div>
  <div id="toast" role="status"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
